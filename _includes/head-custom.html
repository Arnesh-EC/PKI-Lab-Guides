<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false, theme: "default" });

  // Kramdown wraps a ```mermaid fence as either:
  //   <div class="language-mermaid ...">…</div>            (rouge highlighting on — GH Pages default)
  //   <pre><code class="language-mermaid">…</code></pre>    (rouge off)
  // Normalize either form to <div class="mermaid">SOURCE</div>, then render.
  document.querySelectorAll(".language-mermaid").forEach((el) => {
    const source = el.textContent;
    const target = el.closest("div.language-mermaid") || el.closest("pre") || el;
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = source;
    target.replaceWith(div);
  });

  mermaid.run({ querySelector: ".mermaid" });
</script>
